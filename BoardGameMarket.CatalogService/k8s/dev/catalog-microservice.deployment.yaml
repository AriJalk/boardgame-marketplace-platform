apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-microservice-deployment
  labels:
    app: catalog-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-microservice
  template:
    metadata:
      labels:
        app: catalog-microservice
    spec:
      containers:
        - name: catalog-microservice
          image: arieljalkiver/boardgame-market:catalog
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-mongo-config
          volumeMounts:
            - name: seed-volume
              mountPath: /app/SeedData
              readOnly: true
          env:
            - name: IN_MEMORY
              value: "false"
            - name: IS_SEEDING
              value: "true"
            - name: LOCAL_BGG_CLIENT
              value: "true"
            - name: SEED_ROOT
              value: /app/SeedData
      volumes:
        - name: seed-volume
          configMap:
            name: catalog-seed-data
