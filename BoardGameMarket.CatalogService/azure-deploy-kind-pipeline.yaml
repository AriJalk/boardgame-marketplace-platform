trigger:
  branches:
    include:
    - dev

pool:
  name: SelfHosted

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  tag: '$(Build.BuildId)'
  #clusterName: boardgamemarket-cluster
  imageRepository: boardgamemarket-catalog


stages:
- stage: BuildAndTest
  jobs:
  - job: Build
    steps:
     # Restore dependencies
    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build project
    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Run tests
    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '**/*tests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

# Build and load Docker image to kind
- stage: DockerBuildAndPush
  jobs:
  - job: Build
    displayName: Build Docker Image
    steps:
    - task: Docker@2
      inputs:
        command: 'build'
        repository: $(imageRepository)
        Dockerfile: 'src/BoardGameMarket.CatalogService.API/Dockerfile'
        arguments: '-t $(imageRepository):$(tag)'
        buildContext: $(Build.SourcesDirectory)
    - script: |
        kind load docker-image $(imageRepository):$(tag) --name $(clusterName)

- stage: DeployToDev
  dependsOn: DockerBuildAndPush
  condition: and(succeeded('BuildAndTest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'), succeeded('DockerBuildAndPush'))
  variables:
  - group: dev-variables
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    environment: dev
    strategy:
     runOnce:
       deploy:
         steps:
         - checkout: self
           displayName: Checkout source folder
         - script: |
                echo "Listing contents of k8s"
                ls -l $(Build.SourcesDirectory)/k8s/dev
           displayName:  'List Files in k8s/dev Directory'
         - script: |
             find $(Build.SourcesDirectory)/k8s/dev -type f \( -name "*.yaml" -o -name "*.yml" \) -exec sed -i 's/__TAG__/$(tag)/g' {} +
           displayName: 'Replace image tag in all deployment files'
         - script: | 
             kubectl apply -f $(Build.SourcesDirectory)/k8s/dev/. -n $(DevAppsK8sNamespace)