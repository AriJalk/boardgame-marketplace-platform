  #   - postgres-listings
  #   networks:
  #   - listings-network
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: adminpassword


networks:
  listings-network:
    driver: bridge