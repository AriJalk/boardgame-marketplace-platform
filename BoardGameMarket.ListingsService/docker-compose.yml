services:
  boardgamemarket.listingsservice.api:
    image: ${DOCKER_REGISTRY-}boardgamemarketlistingsserviceapi
    build:
      context: .
      dockerfile: src/BoardGameMarket.ListingsService.API/Dockerfile
    volumes:
    - ../BoardGameMarket.Infrastructure/SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: false
      IS_SEEDING: true
      SEED_ROOT: /app/SeedData
      POSTGRES_HOST: postgres-listings
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: boardgamemarket_listings_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    depends_on:
    - postgres-listings
    networks:
    - listings-network

  # Persistance

  postgres-listings:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: boardgamemarket_listings_database
    networks: 
    - listings-network
    volumes:
    - ../BoardGameMarket.Infrastructure/database-init/postgres-listings-init:/docker-entrypoint-initdb.d

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   ports:
  #   - "8081:80"
