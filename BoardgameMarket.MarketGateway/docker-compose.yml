services:
  boardgamemarket.marketgateway.api:
    image: ${DOCKER_REGISTRY-}boardgamemarketmarketgatewayapi
    build:
      context: .
      dockerfile: src/BoardGameMarket.MarketGateway.API/Dockerfile
    environment:
      LISTINGS_SERVICE_HOST: listings-microservice
      LISTINGS_SERVICE_PORT: 8080
      CATALOG_SERVICE_HOST: catalog-microservice
      CATALOG_SERVICE_PORT: 8080
      USERS_SERVICE_HOST: users-microservice
      USERS_SERVICE_PORT: 8080
    networks:
    - microservices-network
    ports:
    - 8081:8081

  listings-microservice:
    image: arieljalkiver/boardgame-market:listings
    networks:
    - microservices-network
    volumes:
    - ../BoardGameMarket.ListingsService/src/BoardGameMarket.ListingsService.API/SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true

  catalog-microservice:
    image: arieljalkiver/boardgame-market:catalog
    networks:
    - microservices-network
    volumes:
    - ../BoardGameMarket.CatalogService/src/BoardGameMarket.CatalogService.API/SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true

  users-microservice:
    image: arieljalkiver/boardgame-market:users
    networks:
    - microservices-network
    volumes:
    - ../BoardGameMarket.UsersService/src/BoardGameMarket.UsersService.API/SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true

networks:
  microservices-network:
    driver: bridge