services:
  boardgamemarket.marketgateway.api:
    image: ${DOCKER_REGISTRY-}boardgamemarketmarketgatewayapi
    build:
      context: .
      dockerfile: src/BoardGameMarket.MarketGateway.API/Dockerfile
    environment:
      LISTINGS_SERVICE_HOST: listings-microservice
      LISTINGS_SERVICE_PORT: 8080
      CATALOG_SERVICE_HOST: catalog-microservice
      CATALOG_SERVICE_PORT: 8080
      USERS_SERVICE_HOST: users-microservice
      USERS_SERVICE_PORT: 8080
    networks:
      - microservices-network
    ports:
      - 8081:8081

  listings-microservice:
    image: arieljalkiver/boardgame-market:listings
    networks:
      - microservices-network
    volumes:
      - ../SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true
      SEED_ROOT: /app/SeedData

  catalog-microservice:
    image: arieljalkiver/boardgame-market:catalog
    networks:
      - microservices-network
    volumes:
      - ../SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true
      LOCAL_BGG_CLIENT: true
      SEED_ROOT: /app/SeedData
      BGGCLIENT__SERVICEAPIKEY: ${BGG_API_KEY}

  users-microservice:
    image: arieljalkiver/boardgame-market:users
    networks:
      - microservices-network
    volumes:
      - ../SeedData:/app/SeedData:ro
    environment:
      IN_MEMORY: true
      IS_SEEDING: true
      SEED_ROOT: /app/SeedData

networks:
  microservices-network:
    driver: bridge
