<div class="full-height-layout">
  <mat-toolbar>
    <button matMiniFab (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar>
  <mat-drawer-container>
    <mat-drawer #drawer mode="side" style="width: 10%; min-width: 200px">
      <div>
        <bgm-side-nav [drawer]="drawer"></bgm-side-nav>
      </div>
    </mat-drawer>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-container>
</div>
