<div class="flex-container">
  <mat-form-field>
    <mat-label>Bgg Link</mat-label>
    <input matInput type="text" [formControl]="urlControl" />
  </mat-form-field>
  @if (isLoading) {
    <mat-spinner diameter="30"></mat-spinner>
  }
  @if (urlControl.disabled) {
    <mat-icon fontIcon="check" class="green"></mat-icon>
  }
</div>
<h3>{{ name }}</h3>
