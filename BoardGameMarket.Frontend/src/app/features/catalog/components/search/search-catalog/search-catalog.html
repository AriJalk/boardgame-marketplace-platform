<mat-form-field>
  <mat-label>Search</mat-label>
  <input type="text" matInput (input)="onValueChanged($event)" />
</mat-form-field>
@if (searchItems$ !== undefined) {
  @for (item of searchItems$ | async; track $index) {
    <div (click)="selectItem(item)" [ngClass]="{ 'selected-highlight': item === selectedItem }">
      <bgm-catalog-item-card [catalogItem]="item"></bgm-catalog-item-card>
    </div>
  }
}
