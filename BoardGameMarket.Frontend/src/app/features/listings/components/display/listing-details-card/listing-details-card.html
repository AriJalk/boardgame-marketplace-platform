<div class="flex-column">
  <h3>Status: {{ listing.status }}</h3>
  <h3>Listing title: {{ listing.title }}</h3>
  <h3>Price: {{ listing.price }}</h3>
  <h3>Details: {{ listing.details }}</h3>
  <h4>Items:</h4>
  @for (item of listing.items; track $index) {
    <mat-card>
      <bgm-listing-item-card [listingItem]="item"></bgm-listing-item-card>
    </mat-card>
  }
  @let queueEntry = queueEntry$ | async;
  @if (listing.status === 'active') {
    <bgm-queue-buyer-panel
      [queueEntry]="queueEntry"
      (subscribeClicked)="onSubscribeClicked()"
      (unsubscribeClicked)="onUnsubscribeClicked()"
    ></bgm-queue-buyer-panel>
  }
</div>
