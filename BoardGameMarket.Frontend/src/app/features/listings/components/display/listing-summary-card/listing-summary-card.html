@if (listing.isSubscribed === true && listing.status == 'active') {
  <div style="color: coral">
    <h3>Title: {{ listing.title }}</h3>
    <h3>Price: {{ listing.price | currency }}</h3>
  </div>
} @else {
  <h3>Title: {{ listing.title }}</h3>
  <h3>Price: {{ listing.price | currency }}</h3>
}
<h3>
  Status: <span>{{ listing.status }}</span>
</h3>
