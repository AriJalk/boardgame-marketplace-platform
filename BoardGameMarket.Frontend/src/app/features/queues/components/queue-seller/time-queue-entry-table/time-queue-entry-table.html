<!-- <p>Showing {{ dataSource.length }} rows</p> -->

<!-- Enable virtual scrolling -->
<cdk-virtual-scroll-viewport
  class="example-container"
  [itemSize]="52"
  [maxBufferPx]="1200"
  [minBufferPx]="100"
>
  <table mat-table [dataSource]="queue" [trackBy]="trackBy">
    <!-- CreatedAt Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Subscribed time</th>
      <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'medium' }}</td>
      <th mat-footer-cell *matFooterCellDef>Subscribed time</th>
    </ng-container>

    <!-- Buyer Column -->
    <ng-container matColumnDef="buyer">
      <th mat-header-cell *matHeaderCellDef>Buyer</th>
      <td mat-cell *matCellDef="let element">
        <a [routerLink]="['/users', element.buyer.userId]">{{ element.buyer.displayName }}</a>
      </td>
      <th mat-footer-cell *matFooterCellDef>Buyer</th>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      <th mat-footer-cell *matFooterCellDef>Status</th>
    </ng-container>

    <!-- Priority Column -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priority</th>
      <td mat-cell *matCellDef="let element">{{ element.priority }}</td>
      <th mat-footer-cell *matFooterCellDef>Priority</th>
    </ng-container>

    <!-- Options Column -->
    <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef>Options</th>
      <td mat-cell *matCellDef="let element">
        <div class="flex-container">
          <!-- Promote button -->
          <button
            type="button"
            (click)="onPriorityClicked(element)"
            [disabled]="element.priority != null || isLocked"
            matMiniFab
          >
            <mat-icon>star</mat-icon>
          </button>
          <!-- Delete button -->
          <button type="button" (click)="onDeleteClicked(element)" matMiniFab [disabled]="isLocked">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
      <th mat-footer-cell *matFooterCellDef>Options</th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</cdk-virtual-scroll-viewport>
