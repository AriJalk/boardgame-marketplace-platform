@if (queues$ | async; as queues) {
  <div class="flex-column">
    Time-Queue
    <bgm-time-queue-entry-table
      [queue]="queues.queueByTime"
      (priorityRequested)="onPriorityAddRequested($event)"
    >
    </bgm-time-queue-entry-table>

    PriorityQueue
    <bgm-priority-queue-entry-table
      [queue]="queues.queueByPriority"
      (updatePriorityRequested)="onPriorityUpdateRequested($event)"
      (deletePriorityRequested)="onPriorityRemoveRequested($event)"
    >
    </bgm-priority-queue-entry-table>
  </div>
}
