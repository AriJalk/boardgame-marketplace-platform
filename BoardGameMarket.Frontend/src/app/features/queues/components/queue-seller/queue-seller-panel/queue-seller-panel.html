@if (queues$ | async; as queues) {
  <div class="flex-container justify-center-evenly">
    <div class="flex-container-column">
      <h4>Time-based queue</h4>
      <div
        #queueByTime="cdkDropList"
        cdkDropList
        [cdkDropListConnectedTo]="queueByPriority"
        [cdkDropListData]="queues.queueByTime"
        cdkDropListSortingDisabled
        cdkDropListHasAnchor
        (cdkDropListDropped)="priorityChangeRequest($event)"
      >
        @for (item of queues.queueByTime; track item.id) {
          <div cdkDrag [cdkDragData]="item">
            <bgm-queue-entry-card [queueEntry]="item"></bgm-queue-entry-card>
          </div>
        }
      </div>
    </div>
    <div class="flex-container-column">
      <h4>Priority-based queue</h4>
      <div
        cdkDropList
        #queueByPriority="cdkDropList"
        [cdkDropListConnectedTo]="queueByTime"
        (cdkDropListDropped)="priorityChangeRequest($event)"
        [cdkDropListData]="queues.queueByPriority"
      >
        @for (item of queues.queueByPriority; track item.id) {
          <div cdkDrag [cdkDragData]="item">
            <bgm-queue-entry-card [queueEntry]="item"></bgm-queue-entry-card>
          </div>
        }
      </div>
    </div>
  </div>
}
