@if (queues$ | async; as queues) {
  @if (topPriorityEntry) {
    <h3>Top of queue</h3>
    <mat-card>
      <div class="flex align-center">
        <h3>
          Buyer:
          <a [routerLink]="['/users', topPriorityEntry.buyer.userId]">
            {{ topPriorityEntry.buyer.displayName }}</a
          >
        </h3>
        <button matButton [disabled]="isLocked" type="button" (click)="onEntryReserveRequested()">
          Reserve entry
        </button>
      </div>
    </mat-card>
  }

  <div class="flex-column">
    Time-Queue
    <bgm-time-queue-entry-table
      [queue]="queues.queueByTime"
      (priorityRequested)="onPriorityAddRequested($event)"
      (deleteRequested)="onDeleteRequested($event)"
      [isLocked]="isLocked"
    >
    </bgm-time-queue-entry-table>

    PriorityQueue
    <bgm-priority-queue-entry-table
      [queue]="queues.queueByPriority"
      (updatePriorityRequested)="onPriorityUpdateRequested($event)"
      (deletePriorityRequested)="onPriorityRemoveRequested($event)"
      [isLocked]="isLocked"
    >
    </bgm-priority-queue-entry-table>
  </div>
}
