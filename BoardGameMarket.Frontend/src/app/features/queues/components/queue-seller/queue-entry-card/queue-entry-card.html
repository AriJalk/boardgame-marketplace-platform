@if (queueEntry.priority !== undefined) {
  <mat-card class="example-box" style="color: salmon">
    <h4>{{ queueEntry.createdAt | date: 'short' }}</h4>
    <h4>{{ queueEntry.status }}</h4>
    <h4>{{ queueEntry.buyer.displayName }}</h4>
    <h4>:: {{ queueEntry.priority }}</h4>
  </mat-card>
} @else {
  <mat-card class="example-box">
    <h4>{{ queueEntry.createdAt | date: 'short' }}</h4>
    <h4>{{ queueEntry.status }}</h4>
    <h4>{{ queueEntry.buyer.displayName }}</h4>
  </mat-card>
}
