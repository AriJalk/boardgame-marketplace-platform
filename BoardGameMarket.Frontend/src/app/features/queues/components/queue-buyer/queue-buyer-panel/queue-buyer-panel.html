<div class="flex-container-column">
  @if (queueEntry) {
    <h4>Subscribed at: {{ queueEntry.createdAt | date: 'short' }}</h4>
    <button matButton class="flex-1" (click)="onUnsubscribed(queueEntry.id)">Unsubscribe</button>
  } @else {
    <button matButton class="flex-1" (click)="onSubscribed()">Subscribe</button>
  }
</div>
