<div class="flex-container-column">
  @if (listingSubscription) {
    <h4>Subscribed at: {{ listingSubscription.createdAt | date: 'short' }}</h4>
    <button matButton class="flex-1" (click)="onUnsubscribed()">Unsubscribe</button>
  } @else {
    <button matButton class="flex-1" (click)="onSubscribed()">Subscribe</button>
  }
</div>
