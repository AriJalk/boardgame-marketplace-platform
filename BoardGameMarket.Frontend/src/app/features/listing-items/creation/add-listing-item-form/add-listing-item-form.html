<div [formGroup]="itemForm">

        @case ('bgg'){
            <bgm-add-bgg-listing-item-form [itemForm]="itemForm"></bgm-add-bgg-listing-item-form>
        }
        @case ('custom') {
            <bgm-add-custom-listing-item-form [itemForm]="itemForm"></bgm-add-custom-listing-item-form>
        }
    }
</div>
