<div [formGroup]="itemForm">
    <mat-form-field class="full-width">
        <mat-label>Catalog ID</mat-label>
        <input type="text" matInput formControlName="catalogItemId" placeholder="Catalog ID">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Details</mat-label>
        <input type="text" matInput formControlName="details" placeholder="Details">
    </mat-form-field>
</div>
