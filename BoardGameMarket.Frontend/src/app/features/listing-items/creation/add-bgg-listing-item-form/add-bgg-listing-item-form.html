<div [formGroup]="itemForm">

        <input type="text" matInput formControlName="bggLink" placeholder="Bgg Link">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Details</mat-label>
        <input type="text" matInput formControlName="details" placeholder="Details">
    </mat-form-field>
</div>
