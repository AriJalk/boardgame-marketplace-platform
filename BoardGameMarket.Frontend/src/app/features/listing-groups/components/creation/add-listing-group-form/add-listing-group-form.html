{{listingGroupForm.value | json}}
<form [formGroup]="listingGroupForm">
    <mat-form-field class="example-full-width">
        <mat-label>Pickup Location</mat-label>
        <input type="text" matInput formControlName="pickupLocation" placeholder="Pickup Location">
    </mat-form-field>
    @for(listing of listings.controls; track listing; let i=$index){
        <bgm-add-listing-form [listingForm]="listing"></bgm-add-listing-form>
    }
    <button matButton (click)="addlisting()">Add listing</button>
</form>
