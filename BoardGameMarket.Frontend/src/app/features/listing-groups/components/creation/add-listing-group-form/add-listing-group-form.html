<div [formGroup]="listingGroupForm">
    <mat-form-field class="full-width">
        <mat-label>Pickup Options</mat-label>
        <input type="text" matInput formControlName="pickupOptions" placeholder="Pickup Options">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Location</mat-label>
        <input type="text" matInput formControlName="location" placeholder="Location">
    </mat-form-field>
    <div class="flex-container children-margin-1">
        @for (listing of listings.controls; track listing; let i = $index) {
        <mat-card class="card-container center-container padding-2">
            <h3>Listing {{i + 1}}</h3>
            <bgm-add-listing-form [listingForm]="listing"></bgm-add-listing-form>
            <button class="half-width" matButton="elevated" type="button" (click)="removeListing(i)">Remove Listing</button>
        </mat-card>
        }
    </div>
    <button matButton="elevated" type="button" (click)="addListing()">Add listing</button>
</div>
