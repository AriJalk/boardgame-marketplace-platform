<div [formGroup]="listingGroupForm">
    <mat-form-field class="example-full-width">
        <mat-label>Pickup Location</mat-label>
        <input type="text" matInput formControlName="pickupOptions" placeholder="Pickup Options">
    </mat-form-field>
    @for (listing of listings.controls; track $index) {
        <bgm-add-listing-form [listingForm]="listing" (listingItemAdded)="addListingItem(listing)"></bgm-add-listing-form>
    }
    <button matButton type="button" (click)="addListing()">Add listing</button>
</div>
