<div class="grid">
  @for (listingGroup of (listingGroups$ | async)?.items; track listingGroup.id) {
    <bgm-listing-group-summary-card
      class="margin-5"
      [listingGroup]="listingGroup"
    ></bgm-listing-group-summary-card>
  }
</div>

<bgm-pagination-controls
  [hasNext]="hasNext"
  [hasPrevious]="hasPrevious"
  (previous)="previous_clicked()"
  (next)="next_clicked()"
></bgm-pagination-controls>
