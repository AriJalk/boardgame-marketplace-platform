<div class="grid gap-1">
  @for (listingGroup of (listingGroups$ | async)?.items; track listingGroup.id) {
    @if (listingGroup.seller.userId === user?.userId) {
      <div class="border-solid padding-2 mat-tertiary-container">
        <bgm-listing-group-summary-card
          [listingGroup]="listingGroup"
        ></bgm-listing-group-summary-card>
      </div>
    } @else {
      <bgm-listing-group-summary-card
        [listingGroup]="listingGroup"
      ></bgm-listing-group-summary-card>
    }
  }
</div>

<bgm-pagination-controls
  [hasNext]="(listingGroups$ | async)?.nextCursor !== null"
  [hasPrevious]="currentPageIndex > 0"
  (previous)="previous_clicked()"
  (next)="next_clicked()"
></bgm-pagination-controls>
