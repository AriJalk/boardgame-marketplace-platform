<mat-card class="padding-5">
  <div>
    <h3>Seller: {{ listingGroup.seller.displayName }}</h3>
    <h3>Location: {{ listingGroup.location }}</h3>
    <h3>Posting Date: {{ listingGroup.postingTime | date }}</h3>
    <h3>Pickup Options: {{ listingGroup.pickupOptions }}</h3>
    <h3>Details: {{ listingGroup.details }}</h3>
  </div>
  <div class="mat-secondary-container">
    @for (listing of listingGroup.listings; track $index) {
      <div class="padding-2">
        <bgm-listing-summary-card [listing]="listing"></bgm-listing-summary-card>
      </div>
    }
  </div>
  <mat-card-actions>
    <button matButton="elevated" [routerLink]="['/listing-groups', listingGroup.id]">
      Details
    </button>
  </mat-card-actions>
</mat-card>
