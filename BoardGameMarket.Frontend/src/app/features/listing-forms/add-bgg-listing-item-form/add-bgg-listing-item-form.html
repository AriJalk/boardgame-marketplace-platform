<div [formGroup]="formGroup">
  @if (item$ | async; as item) {
    <h3>Name: {{ item.name }}</h3>
  }
  <bgm-retrieve-bgg-item-id (catalogItemRetrieved)="attachItem($event)"></bgm-retrieve-bgg-item-id>
  <mat-form-field>
    <mat-label>Details</mat-label>
    <input type="text" matInput formControlName="details" placeholder="Details" />
  </mat-form-field>
</div>
@if (catalogItem?.get('id')?.invalid && formGroup.touched) {
  <h4>Missing bgg info</h4>
}
