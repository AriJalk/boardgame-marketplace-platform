<div [formGroup]="formGroup">
  <mat-form-field>
    <mat-label>Title</mat-label>
    <input type="text" matInput formControlName="title" placeholder="Title" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Price</mat-label>
    <input type="number" matInput formControlName="price" placeholder="Price" />
  </mat-form-field>
  <div class="flex-column gap-1">
    @for (listingItem of listingItemFormGroups.controls; track listingItem; let i = $index) {
      <mat-card>
        <div class="mat-secondary-container">
          <h4>Item {{ i + 1 }}</h4>
          <bgm-listing-item-form [formGroup]="listingItem"></bgm-listing-item-form>
          <button
            class="full-width margin-1"
            matButton="elevated"
            type="button"
            (click)="removeListingItem(i)"
          >
            Remove Item
          </button>
        </div>
      </mat-card>
    }
  </div>
</div>
<div class="flex">
  <button class="flex-1" matButton="elevated" type="button" (click)="addBggListingItem()">
    Add BGG Item
  </button>
  <button class="flex-1" matButton="elevated" type="button" (click)="addCustomListingItem()">
    Add Custom Item
  </button>
</div>

@if (listingId !== null) {
  <div>
    <bgm-queue-seller-panel [listingsId]="listingId"></bgm-queue-seller-panel>
  </div>
}
