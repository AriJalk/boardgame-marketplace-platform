<div [formGroup]="itemForm">
  <div [formGroup]="catalogItem">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input type="text" matInput formControlName="name" placeholder="Name" />
      @if (catalogItem.get('name')?.invalid && itemForm.touched) {
        Required
      }
    </mat-form-field>
  </div>
  <mat-form-field class="full-width">
    <mat-label>Details</mat-label>
    <input type="text" matInput formControlName="details" placeholder="Details" />
  </mat-form-field>
</div>
