<div [formGroup]="formGroup" class="flex-column">
  <mat-form-field>
    <mat-label>Pickup Options</mat-label>
    <input type="text" matInput formControlName="pickupOptions" placeholder="Pickup Options" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Location</mat-label>
    <input type="text" matInput formControlName="location" placeholder="Location" />
  </mat-form-field>
  <div class="flex-column gap-1">
    <h3>Listings</h3>
    @for (listing of listingFormGroups.controls; track listing; let i = $index) {
      <mat-accordion>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <div class="flex-column">
                <div>
                  {{ getListingTitle(listing) }}
                </div>
                <div>
                  {{ getListingStatus(listing) }}
                </div>
              </div>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <mat-card>
            <bgm-listing-form [formGroup]="listing"></bgm-listing-form>
            <button class="margin-5" matButton="elevated" type="button" (click)="removeListing(i)">
              Remove Listing
            </button>
          </mat-card>
        </mat-expansion-panel>
      </mat-accordion>
    }
  </div>
  <button class="margin-1" matButton="elevated" type="button" (click)="addListing()">
    Add listing
  </button>
</div>
