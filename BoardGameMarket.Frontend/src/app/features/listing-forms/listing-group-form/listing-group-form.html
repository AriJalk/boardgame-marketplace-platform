<div [formGroup]="formGroup">
  <mat-form-field class="full-width">
    <mat-label>Pickup Options</mat-label>
    <input type="text" matInput formControlName="pickupOptions" placeholder="Pickup Options" />
  </mat-form-field>
  <mat-form-field class="full-width">
    <mat-label>Location</mat-label>
    <input type="text" matInput formControlName="location" placeholder="Location" />
  </mat-form-field>
  <div class="flex-container children-margin-1">
    @for (listing of listingFormGroups.controls; track listing; let i = $index) {
      <mat-card>
        <h3>Listing {{ i + 1 }}</h3>
        <bgm-listing-form [formGroup]="listing"></bgm-listing-form>
        <button class="half-width" matButton="elevated" type="button" (click)="removeListing(i)">
          Remove Listing
        </button>
      </mat-card>
    }
  </div>
  <button matButton="elevated" type="button" (click)="addListing()">Add listing</button>
</div>
