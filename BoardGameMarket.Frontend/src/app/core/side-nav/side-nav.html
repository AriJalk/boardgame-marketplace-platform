<h3 style="justify-self: center">Boardgame Market</h3>
<img src="images/powered-by-bgg.webp" style="width: 100%" />
<div style="text-align: center">
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/listing-groups']"
    (click)="drawer.toggle()"
  >
    Listing Groups
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/listing-groups/create']"
    (click)="drawer.toggle()"
    [disabled]="!isLoggedIn"
  >
    Create Listing Group
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/my-listings']"
    (click)="drawer.toggle()"
    [disabled]="!isLoggedIn"
  >
    My Listings
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/my-reservations']"
    (click)="drawer.toggle()"
    [disabled]="!isLoggedIn"
  >
    My Reservations
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/my-listing-sales']"
    (click)="drawer.toggle()"
    [disabled]="!isLoggedIn"
  >
    My Sold Listings
  </button>
</div>
