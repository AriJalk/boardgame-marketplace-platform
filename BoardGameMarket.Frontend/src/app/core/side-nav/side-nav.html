<h3 style="justify-self: center;">Boardgame Market</h3>
<img src="images/powered-by-bgg.webp" style="width: 100%" />
<div style="text-align: center">
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/listing-groups']"
    (click)="drawer.toggle()"
  >
    Listings
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/listing-groups/create']"
    (click)="drawer.toggle()"
  >
    Add Listings
  </button>
  <button
    class="margin-5"
    matButton="elevated"
    [routerLink]="['/my-listings']"
    (click)="drawer.toggle()"
  >
    My Listings
  </button>
</div>
