apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-catalog-deployment
  labels:
    app: mongodb-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-catalog
  template:
    metadata:
      labels:
        app: mongodb-catalog
    spec:
      containers:
      - name: mongodb-orders
        image: mongo:8.2.7
        ports:
        - containerPort: 27017
        env:
          - name: MONGO_INITDB_DATABASE
            value: catalog_database