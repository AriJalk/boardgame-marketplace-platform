apiVersion: v1
data:
  postgres-init.sql: "CREATE TABLE public.listing_groups\r\n(\r\n    \"id\" UUID NOT
    NULL,\r\n    \"seller_user_id\" UUID NOT NULL,\r\n    \"created_at\" TIMESTAMP
    NOT NULL,\r\n    \"modified_at\" TIMESTAMP NOT NULL,\r\n    \"details\" VARCHAR(100),\r\n
    \   \"pickup_options\" VARCHAR(100) NOT NULL,\r\n    \"location\" VARCHAR(100)
    NOT NULL,\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE TABLE public.listings\r\n(\r\n
    \   \"id\" UUID NOT NULL,\r\n    \"title\" VARCHAR(100) NOT NULL,\r\n    \"listing_group_id\"
    UUID NOT NULL,\r\n    \"status\" INT NOT NULL,\r\n    \"created_at\" TIMESTAMP
    NOT NULL,\r\n    \"modified_at\" TIMESTAMP NOT NULL,\r\n    \"price\" NUMERIC(10,2)
    NOT NULL,\r\n    \"details\" VARCHAR(100),\r\n    \"seller_user_id\" UUID NOT
    NULL,\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE TABLE public.listing_items\r\n(\r\n
    \   \"id\" UUID NOT NULL,\r\n    \"listing_id\" UUID NOT NULL,\r\n    \"catalog_id\"
    UUID NOT NULL,\r\n    \"details\" VARCHAR(100),\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE
    TABLE public.listing_queue_entries\r\n(\r\n    \"id\" UUID NOT NULL,\r\n    \"listing_id\"
    UUID NOT NULL,\r\n    \"status\" INT NOT NULL,\r\n    \"buyer_user_id\" UUID NOT
    NULL,\r\n    \"created_at\" TIMESTAMP NOT NULL,\r\n    \"modified_at\" TIMESTAMP
    NOT NULL,\r\n    \"priority\" DECIMAL(10,2),\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE
    TABLE public.listing_reservations\r\n(\r\n    \"id\" UUID NOT NULL,\r\n    \"created_at\"
    TIMESTAMP NOT NULL,\r\n    \"modified_at\" TIMESTAMP NOT NULL,\r\n    \"status\"
    INT NOT NULL,\r\n    \"listing_queue_entry_id\" UUID NOT NULL,\r\n    \"listing_id\"
    UUID NOT NULL,\r\n    \"seller_user_id\" UUID NOT NULL,\r\n    \"buyer_user_id\"
    UUID NOT NULL,\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE TABLE public.listing_sales\r\n(\r\n
    \   \"id\" UUID NOT NULL,\r\n       \"listing_id\" UUID NOT NULL,\r\n    \"completed_at\"
    TIMESTAMP NOT NULL,\r\n    \"reservation_id\" UUID NOT NULL,\r\n    \"listing_queue_entry_id\"
    UUID NOT NULL,\r\n    \"seller_user_id\" UUID NOT NULL,\r\n    \"buyer_user_id\"
    UUID NOT NULL,\r\n    PRIMARY KEY (\"id\")\r\n);\r\n\r\nCREATE SCHEMA IF NOT EXISTS
    internal;\r\n\r\nCREATE TABLE IF NOT EXISTS internal.seed_markers (\r\n    name
    TEXT PRIMARY KEY,\r\n    seeded_at TIMESTAMP NOT NULL DEFAULT NOW()\r\n);\r\n"
kind: ConfigMap
metadata:
  name: postgres-listings-init-sql
