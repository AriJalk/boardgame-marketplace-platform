trigger:
  branches:
    include:
      - dev

pool:
  name: SelfHosted

variables:
  - group: dev-variables

stages:
  - stage: CreateNamespaces
    jobs:
      - deployment: CreateNamespaces
        displayName: Create namespaces
        environment: dev-infra
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source folder
                - script: |
                    kubectl apply -f k8s/dev-namespaces
                  displayName: Create namespaces

  - stage: CreateDbSecrets
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      - group: dev-secrets
    jobs:
      - deployment: CreateDbSecrets
        displayName: Create database secrets
        environment: dev-infra
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source folder
                # Users
                - script: |
                    NAMESPACES="$(DEV_APPS_K8S_NAMESPACE) $(DEV_INFRA_K8S_NAMESPACE)"

                    for ns in $NAMESPACES
                    do
                      echo "Creating secret in $ns"
                      
                      kubectl create secret generic postgres-users-credentials \
                      --from-literal=POSTGRES_USER=$(POSTGRES_USERS_USERNAME) \
                      --from-literal=POSTGRES_PASSWORD=$(POSTGRES_USERS_PASSWORD) \
                      -n $ns \
                      --dry-run=client -o yaml > secret-$ns.yaml

                       kubectl apply -f secret-$ns.yaml
                    done
                  displayName: "Create users postgres secret (multi-namespace)"
                # Listings
                - script: |
                    NAMESPACES="$(DEV_APPS_K8S_NAMESPACE) $(DEV_INFRA_K8S_NAMESPACE)"

                    for ns in $NAMESPACES
                    do
                      echo "Creating secret in $ns"
                      
                      kubectl create secret generic postgres-listings-credentials \
                      --from-literal=POSTGRES_USER=$(POSTGRES_LISTINGS_USERNAME) \
                      --from-literal=POSTGRES_PASSWORD=$(POSTGRES_LISTINGS_PASSWORD) \
                      -n $ns \
                      --dry-run=client -o yaml > secret-$ns.yaml
                      
                      kubectl apply -f secret-$ns.yaml
                    done
                  displayName: "Create listings postgres secret (multi-namespace)"

  - stage: CreateBggApiSecret
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      - group: api-keys
    jobs:
      - deployment: CreateBggApiSecret
        displayName: Create Bgg api secret
        environment: dev-apps
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source folder
                - script: |
                    kubectl create secret generic bgg-api-secret \
                    --from-literal=BGGCLIENT__SERVICEAPIKEY="$(BGG_API_KEY)" \
                    -n $(DEV_APPS_K8S_NAMESPACE) \
                    --dry-run=client -o yaml > secret.yaml

                    kubectl apply -f secret.yaml

                  displayName: "Create bgg api secret"

  - stage: DeployToDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeploymentToDev
        displayName: Deployment to Dev Environment
        environment: dev-infra
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source folder
                - script: |
                    echo "Listing contents of k8s"
                    ls -l $(Build.SourcesDirectory)/k8s/dev
                  displayName: "List Files in k8s/dev Directory"
                - script: |
                    kubectl apply -n $(DEV_INFRA_K8S_NAMESPACE) -f $(Build.SourcesDirectory)/k8s/dev --recursive
                  displayName: "Apply deployment"
