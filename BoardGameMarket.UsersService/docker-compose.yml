services:
  boardgamemarket.usersservice.api:
    image: ${DOCKER_REGISTRY-}boardgamemarketusersserviceapi
    build:
      context: .
      dockerfile: src/BoardGameMarket.UsersService.API/Dockerfile
    environment:
      POSTGRES_HOST: postgres-users
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: boardgamemarket_users_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      IS_SEEDING: true
      IN_MEMORY: false
      SEED_ROOT: /app/SeedData
    depends_on:
      - postgres-users
    networks: 
    - users-network
    volumes:
    - ./infrastructure/seed-data:/app/SeedData:ro

  postgres-users:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: boardgamemarket_users_database
    networks: 
    - users-network
    volumes:
    - ./infrastructure/database-init:/docker-entrypoint-initdb.d

networks:
  users-network:
    driver: bridge